<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waterways — one continuous body</title>
    <link rel="stylesheet" href="./src/style.css" />

  <body>
    <div id="boot" style="
      position: fixed; inset: 0; z-index: 10; display: flex;

        <p style="font-style: normal; font-family: ui-monospace, Menlo, monospace;
           font-size: 15px; background: #eae0c5; padding: 8px 14px; border-radius: 4px;
           display: inline-block; margin: 8px 0;">npm install &nbsp;&amp;&amp;&nbsp; npm run dev</p>
        <p>then open the address it prints (usually
        <span style="font-family: ui-monospace, Menlo, monospace; font-style: normal;">http://localhost:5173</span>).</p>
